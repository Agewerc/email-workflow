<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ prompt_name }}</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <a class="back-link" href="/prompts/">Prompt Library</a>
      <div class="topbar-actions">
        <a class="button-link" href="/">Workflows</a>
      </div>
    </div>

    <header class="page-header">
      <div class="page-header-text">
        <p class="eyebrow">Prompt Editor</p>
        <h1>{{ prompt_name }}</h1>
        <p>Edit the prompt source and save changes back to <code>/config/prompts</code>.</p>
      </div>
    </header>

    <section class="section">
      <div class="panel">
        <form method="post" class="prompt-form">
          <textarea name="content">{{ content }}</textarea>
          <button type="submit">Save prompt</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
