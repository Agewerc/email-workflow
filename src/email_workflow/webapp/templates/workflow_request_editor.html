<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ request_title }}</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <a class="back-link" href="/workflow-requests/">Workflow Requests</a>
      <div class="topbar-actions">
        <a class="button-link" href="/">Workflows</a>
      </div>
    </div>

    <header class="page-header">
      <div class="page-header-text">
        <p class="eyebrow">Workflow Request</p>
        <h1>{{ request_title }}</h1>
        <p>Write the future workflow instructions here. Later you can point me at this request and ask me to implement it.</p>
      </div>
      <div class="page-stats">
        <div class="stat">
          <span class="stat-label">File</span>
          <span class="stat-value stat-value-small">{{ request_name }}</span>
        </div>
      </div>
    </header>

    <section class="section">
      <div class="panel">
        <form method="post" class="prompt-form">
          <textarea name="content">{{ content }}</textarea>
          <button type="submit">Save request</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
