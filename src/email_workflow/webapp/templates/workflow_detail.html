<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ workflow.name }}</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell">
    <a class="back-link" href="/">Back</a>

      <pre>{{ config_json }}</pre>
    </section>
  </main>
</body>
</html>
