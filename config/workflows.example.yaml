  - id: prof-g-insights
    workflow_type: prof_g_insights
    enabled: true
    frequency: "2026-05-02T15:00:00+08:00"
    name: Prof G Weekly Insights
    description: Weekly long-form insight report synthesized from emails in the Prof G newsletter label.
    tags:
      - gmail
      - newsletter
      - prof-g
      - insights
    config:
      email_account: alangewerc@gmail.com
      email_to: alangewerc@gmail.com
      email_subject: "Weekly Prof G Insights"
      model_provider: deepseek
      models:
        deepseek:
          api_key_env: DEEPSEEK_API_KEY
          base_url: https://api.deepseek.com/v1
          model: deepseek-chat
          cost_per_1m_input: 0.14
          cost_per_1m_output: 0.28
      gmail_query: "label:newsletter-prof-g newer_than:7d"
      max_threads: 12
      body_max_chars: 8000
      max_insights: 5
      llm_timeout_seconds: 60
      llm_max_tokens: 3200
      prompt_files:
        synthesize: config/prompts/prof_g_insights_synthesize.txt
      template_html: src/email_workflow/templates/digest.html.j2
      template_text: src/email_workflow/templates/digest.txt.j2
