workflows:
  - id: citizen-brief
    workflow_type: citizen_brief
    enabled: true
    frequency: "2026-01-01T09:00:00+08:00"
    name: Citizen Brief
    description: Daily intelligence briefing synthesized from Gmail newsletters and inbox activity.
    tags:
      - gmail
      - briefing
      - llm
    config:
      email_account: alangewerc@gmail.com
      email_to: alangewerc@gmail.com
      email_subject: "Daily Citizen Brief for Alan"
      model_provider: deepseek
      models:
        deepseek:
          api_key_env: DEEPSEEK_API_KEY
          base_url: https://api.deepseek.com/v1
          model: deepseek-chat
          cost_per_1m_input: 0.14
          cost_per_1m_output: 0.28
        openai:
          api_key_env: OPENAI_API_KEY
          base_url: https://api.openai.com/v1
          model: gpt-4o-mini
          cost_per_1m_input: 0.15
          cost_per_1m_output: 0.60
      sections:
        - name: News
          query: 'label:"Newsletter/News" newer_than:1d'
          max_threads: 5
        - name: Economics
          query: 'label:"Newsletter/Business.Economics" newer_than:1d'
          max_threads: 5
        - name: Australia
          query: 'label:"Newsletter/News" (Australia OR Australian) newer_than:1d'
          max_threads: 4
        - name: Brazil
          query: 'label:"Newsletter/Brasil" newer_than:1d'
          max_threads: 4
        - name: Tech/AI
          query: 'label:"Newsletter/Tech.AI" newer_than:1d'
          max_threads: 5
        - name: Prof G Insights
          query: 'label:"Newsletter/Prof G" newer_than:1d'
          max_threads: 3
      inbox_section:
        enabled: true
        name: Inbox Highlights
        query: "newer_than:1d in:inbox -label:Newsletter"
        max_threads: 8
      body_max_chars: 2500
      llm_retries: 2
      llm_timeout_seconds: 30
      prompt_files:
        section: config/prompts/citizen_brief_section.txt
        inbox: config/prompts/citizen_brief_inbox.txt
        editor: config/prompts/citizen_brief_editor.txt
      template_html: src/email_workflow/templates/digest.html.j2
      template_text: src/email_workflow/templates/digest.txt.j2
  - id: weekend-weather-surf-trigg
    workflow_type: weekend_weather_surf
    enabled: true
    frequency: "2026-01-04T18:00:00+08:00"
    name: Weekend Weather + Surf (Trigg)
    description: Thursday evening weekend surf and weather outlook for Trigg Beach.
    tags:
      - weather
      - surf
      - perth
    config:
      email_account: alangewerc@gmail.com
      email_to: alangewerc@gmail.com
      email_subject: "Weekend Weather + Surf Forecast — Trigg"
      beach:
        slug: trigg
        name: Trigg Beach
        latitude: -31.870
        longitude: 115.756
        surfline_spot_id: "584204204e65fad6a7709268"
      timezone: Australia/Perth
      forecast_days: 8
      schedule_day: Thursday
      schedule_time: "18:00"
      schedule_timezone: Australia/Perth
      weather_source_label: Open-Meteo
      surf_source_label: Surfline
      template_html: src/email_workflow/templates/weekend_weather_surf.html.j2
      template_text: src/email_workflow/templates/weekend_weather_surf.txt.j2
  - id: job-alert-digest
    workflow_type: job_alert_digest
    enabled: true
    frequency: "2026-01-01T08:00:00+08:00"
    name: Job Alert Digest
    description: Daily digest of high-fit job alerts sourced from Gmail.
    tags:
      - gmail
      - jobs
      - career
    config:
      email_account: alangewerc@gmail.com
      email_to: alangewerc@gmail.com
      email_subject: "Job Alert Digest"
      model_provider: deepseek
      models:
        deepseek:
          api_key_env: DEEPSEEK_API_KEY
          base_url: https://api.deepseek.com/v1
          model: deepseek-chat
          cost_per_1m_input: 0.14
          cost_per_1m_output: 0.28
      gmail_query: 'label:"Work/job.alert" newer_than:1d'
      max_threads: 20
      body_max_chars: 6000
      max_jobs_per_email: 5
      max_digest_jobs: 10
      min_digest_score: 55
      profile_file: "/Users/alangewerc/Library/CloudStorage/GoogleDrive-alangewerc@gmail.com/My Drive/Career/master_cv.yaml"
      inclusion_keywords:
        - data science
        - analytics
        - ai
        - machine learning
        - operational intelligence
      exclusion_keywords:
        - graduate
        - internship
        - junior
      target_functions:
        - principal
        - lead
        - head of data
        - head of analytics
      target_industries:
        - mining
        - energy
        - resources
        - regulated
      target_locations:
        - perth
        - australia
        - remote
      prompt_files:
        extract: config/prompts/job_alert_extract.txt
        score: config/prompts/job_alert_score.txt
        editor: config/prompts/job_alert_editor.txt
      template_html: src/email_workflow/templates/job_alert_digest.html.j2
      template_text: src/email_workflow/templates/job_alert_digest.txt.j2
